<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-v2.png" />
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = 'dark';
        try { const saved = localStorage.getItem('ujeladea:appearance:v1'); if (['light', 'dark', 'system'].includes(saved)) preference = saved; } catch {}
        const theme = preference === 'system' ? (window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : preference;
        document.documentElement.dataset.appearance = preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <!--page-meta-->
    <meta name="theme-color" content="#8f1937" />
    <style id="app-startup-style">
      body { margin: 0; }
      html:has(#root:empty), body:has(> #root:empty) { background: #8f1937; }
      #root:empty { display: grid; place-items: center; min-height: 100vh; min-height: 100dvh; background: #8f1937; }
      #root:empty::before { content: ''; width: 120px; height: 140px; background: url('/logo-ujeladea.png') center / contain no-repeat; }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UJELADEA" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
